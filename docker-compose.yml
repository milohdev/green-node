services:
  postgres:
    image: postgres:16-alpine
    container_name: greennode_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: greennode_db
      POSTGRES_USER: greennode_user
      POSTGRES_PASSWORD: greennode123
    ports:
      - "5434:5432"
    volumes:
      - greennode_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greennode_user -d greennode_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  greennode_pgdata:
